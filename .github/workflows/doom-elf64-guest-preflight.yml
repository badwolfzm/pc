name: Doom final ELF64 guest preflight
on:
  pull_request:
    paths:
      - 'tools/doom-elf64-guest-preflight/**'
      - '.github/workflows/doom-elf64-guest-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ELF64 parser adversarial tests
        run: python3 -m unittest discover -s tools/doom-elf64-guest-preflight -p 'test_*.py' -v
      - name: Syntax check
        run: python3 -m py_compile tools/doom-elf64-guest-preflight/preflight.py tools/doom-elf64-guest-preflight/test_preflight.py
      - name: Build and inspect a real x86-64 freestanding ELF64 ET_EXEC
        run: |
          echo '.global _start' > /tmp/warden-preflight-tiny.s
          echo '_start:' >> /tmp/warden-preflight-tiny.s
          echo '  jmp _start' >> /tmp/warden-preflight-tiny.s
          cc -nostdlib -static -no-pie -Wl,--build-id=none -Wl,-e,_start /tmp/warden-preflight-tiny.s -o /tmp/warden-preflight-tiny.elf
          python3 tools/doom-elf64-guest-preflight/preflight.py /tmp/warden-preflight-tiny.elf --guest-mib 512 --reserved-mib 128 > /tmp/warden-preflight-real.json
          python3 -c 'import json; r=json.load(open("/tmp/warden-preflight-real.json")); assert r["valid"] and r["elf_type"] == "ET_EXEC" and r["load_segments"] >= 1 and not r["guest_boot_verified"]'
