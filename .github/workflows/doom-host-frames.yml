name: Genuine Doom host game-loop frames (not Warden)
on:
  pull_request:
    paths:
      - 'tools/doom-host-frames/**'
      - '.github/workflows/doom-host-frames.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact review dependencies without modifying their branches
        run: |
          git fetch --quiet --depth=1 origin c60e37f85a1f704290234ec95a1aae60622fbb51
          test "$(git rev-parse FETCH_HEAD)" = c60e37f85a1f704290234ec95a1aae60622fbb51
          git restore --source=FETCH_HEAD -- tools/doomgeneric-warden
          git fetch --quiet --depth=1 origin 41d9274938cec540a8bef62933e6acc2d8f84b59
          test "$(git rev-parse FETCH_HEAD)" = 41d9274938cec540a8bef62933e6acc2d8f84b59
          git restore --source=FETCH_HEAD -- tools/doom-real-wfile-link/bridge_backend.c
      - name: Fetch pinned genuine Doom engine
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/genuine-doomgeneric
          git -C /tmp/genuine-doomgeneric checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
      - name: Obtain legal Freedoom phase-one IWAD
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip \
            -o /tmp/freedoom.zip
          unzip -Z1 /tmp/freedoom.zip | grep -iE '(^|/)freedoom1[.]wad$'
          file="$(unzip -Z1 /tmp/freedoom.zip | grep -iE '(^|/)freedoom1[.]wad$' | head -n1)"
          unzip -p /tmp/freedoom.zip "$file" > DOOM1.WAD
          test "$(head -c4 DOOM1.WAD)" = IWAD\n          echo "7323bcc168c5a45ff10749b339960e98314740a734c30d4b9f3337001f9e703d  DOOM1.WAD" | sha256sum --check
      - name: Start genuine Doom and verify ten gameplay frames plus consumed keyboard transitions (host only)
        run: bash tools/doom-host-frames/run.sh /tmp/genuine-doomgeneric/doomgeneric DOOM1.WAD
