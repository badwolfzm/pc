name: Compose 16 genuine Doom native CRT imports in one ET_REL link
on:
  pull_request:
    paths:
      - 'tools/doom-native-runtime-bundle/**'
      - '.github/workflows/doom-native-runtime-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict symbol/overlap tests
        run: python3 -m unittest discover -s tools/doom-native-runtime-bundle -p 'test_*.py' -v
      - name: Fetch exact pinned upstream engine
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/warden-upstream-doom
          git -C /tmp/warden-upstream-doom checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
          test "$(git -C /tmp/warden-upstream-doom rev-parse HEAD)" = "e257a09527062bfb986b6e5e0780839b6cbd5b71"
      - name: Stage pinned merged PR225 formatter from main history (not PR218)
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor 4246bde3e786f1c51e3b047292a592cb5c057bf1 FETCH_HEAD
          mkdir -p target/doom-runtime-bundle/staged
          git show 4246bde3e786f1c51e3b047292a592cb5c057bf1:tools/doom-native-format/doom_format.c > target/doom-runtime-bundle/staged/format.c
      - name: Verify source-backed 6 MiB Doom default zone fits 8 MiB
        run: |
          python3 tools/doom-zone-capacity-gate/gate.py \
            --source /tmp/warden-upstream-doom/doomgeneric/i_system.c \
            --commit e257a09527062bfb986b6e5e0780839b6cbd5b71 \
            --arena-bytes 8388608
      - name: Exercise real 8 MiB arena on 6 MiB zone plus 1 MiB scratch with UBSan
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
            -DDOOM_ARENA_BYTES=8388608 \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I tools/doom-freestanding-arena \
            tools/doom-freestanding-arena/arena.c tools/doom-eight-mib-zone/test_zone.c \
            -o /tmp/warden-doom-eight-mib-arena
          /tmp/warden-doom-eight-mib-arena
      - name: Compile genuine Doom + all merged CRT providers and one pinned candidate
        run: |
          python3 tools/doom-native-runtime-bundle/compose.py \
            --source /tmp/warden-upstream-doom/doomgeneric \
            --format-source target/doom-runtime-bundle/staged/format.c \
            --output target/doom-runtime-bundle/result
      - name: Archive actual symbol and static size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doom-native-runtime-bundle
          path: |
            target/doom-runtime-bundle/result/report.json
            target/doom-runtime-bundle/result/et-rel-sections.txt
          if-no-files-found: ignore
