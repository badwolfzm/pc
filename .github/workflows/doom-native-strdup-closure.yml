name: Genuine Doom freestanding strdup closure
on:
  pull_request:
    paths:
      - 'tools/doom-native-strdup-closure/**'
      - '.github/workflows/doom-native-strdup-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify merged Warden bounded arena and heap-ABI closure
        run: |
          test -f tools/doom-freestanding-arena/arena.c
          test -f tools/doom-native-heap-closure/close.py
      - name: Run regression and functional tests
        run: |
          python3 -m unittest discover -s tools/doom-native-strdup-closure -p 'test_*.py' -v
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fno-builtin -fsanitize=undefined -Wl,--wrap=malloc tools/doom-native-strdup-closure/strdup.c tools/doom-native-strdup-closure/test_strdup.c -o /tmp/doom-strdup-test
          /tmp/doom-strdup-test
      - name: Fetch pinned real Doom source
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/pinned-doomgeneric
          git -C /tmp/pinned-doomgeneric checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
          test "$(git -C /tmp/pinned-doomgeneric rev-parse HEAD)" = e257a09527062bfb986b6e5e0780839b6cbd5b71
      - name: Link actual freestanding upstream engine plus heap and strdup
        run: python3 tools/doom-native-strdup-closure/check.py --source /tmp/pinned-doomgeneric/doomgeneric --output target/doom-strdup-closure
      - name: Archive genuine linker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-doom-strdup-link
          path: target/doom-strdup-closure/strdup-report.json
          if-no-files-found: ignore
