name: Doom real upstream WAD file API linkage
on:
  pull_request:
    paths:
      - 'tools/doom-real-wfile-link/**'
      - '.github/workflows/doom-real-wfile-link.yml'
      - 'tools/doom-wad-stream/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-file-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage EXACT pinned, unmerged WAD class bridge dependency from PR 110
        run: |
          git fetch --quiet --depth=1 origin 5b026137266e79f8a0b519a08bec91a0cfbb957b
          test "$(git rev-parse FETCH_HEAD)" = "5b026137266e79f8a0b519a08bec91a0cfbb957b"
          git restore --source=FETCH_HEAD -- tools/doom-wad-class-bridge
          test -f tools/doom-wad-class-bridge/doom_wad_bridge.c
      - name: Clone exact upstream Doom source
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/pinned-doomgeneric
          git -C /tmp/pinned-doomgeneric checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
          test "$(git -C /tmp/pinned-doomgeneric rev-parse HEAD)" = "e257a09527062bfb986b6e5e0780839b6cbd5b71"
      - name: Link and exercise REAL upstream W_OpenFile API through authorized Warden backend
        run: bash tools/doom-real-wfile-link/run.sh /tmp/pinned-doomgeneric/doomgeneric
