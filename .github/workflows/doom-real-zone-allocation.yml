name: Actual Doom bounded arena 6 MiB host allocation test
on:
  pull_request:
    paths:
      - 'tools/doom-real-zone-allocation/**'
      - '.github/workflows/doom-real-zone-allocation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Doomgeneric startup allocation source
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/real-zone-doom
          git -C /tmp/real-zone-doom checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
          test "$(git -C /tmp/real-zone-doom rev-parse HEAD)" = e257a09527062bfb986b6e5e0780839b6cbd5b71
      - name: Fail closed at 1 MiB and accept nominal 8 MiB capacity
        run: |
          if python3 tools/doom-zone-capacity-gate/gate.py --source /tmp/real-zone-doom/doomgeneric/i_system.c --commit e257a09527062bfb986b6e5e0780839b6cbd5b71 --arena-bytes 1048576; then
            echo 'Unexpected 1 MiB capacity pass' >&2
            exit 1
          fi
          python3 tools/doom-zone-capacity-gate/gate.py --source /tmp/real-zone-doom/doomgeneric/i_system.c --commit e257a09527062bfb986b6e5e0780839b6cbd5b71 --arena-bytes 8388608
      - name: Compile and execute actual arena at 1 MiB and 8 MiB
        run: python3 tools/doom-real-zone-allocation/run.py
