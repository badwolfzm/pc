name: Genuine Doom 17 freestanding runtime import composition
on:
  pull_request:
    paths:
      - 'tools/doom-runtime-17-scanf/**'
      - '.github/workflows/doom-runtime-17-scanf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit test exact closure and hostile/double-provider cases
        run: python3 -m unittest discover -s tools/doom-runtime-17-scanf -p 'test_*.py' -v
      - name: Fetch and verify original genuine Doom engine
        run: |
          git clone --quiet https://github.com/ozkl/doomgeneric.git /tmp/doomgeneric-pinned
          git -C /tmp/doomgeneric-pinned checkout --quiet --detach e257a09527062bfb986b6e5e0780839b6cbd5b71
          test "$(git -C /tmp/doomgeneric-pinned rev-parse HEAD)" = e257a09527062bfb986b6e5e0780839b6cbd5b71
      - name: Stage exact merged formatter and exact external scanner revision
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor 4246bde3e786f1c51e3b047292a592cb5c057bf1 FETCH_HEAD
          git fetch -q origin refs/heads/agent/doom-native-scanf-integer-20261106
          git merge-base --is-ancestor 62dc9f73bee7753bd81d889a0e44ee8e95ce2220 FETCH_HEAD
          mkdir -p target/doom-runtime-17-scanf/staged
          git show 4246bde3e786f1c51e3b047292a592cb5c057bf1:tools/doom-native-format/doom_format.c > target/doom-runtime-17-scanf/staged/format.c
          git show 62dc9f73bee7753bd81d889a0e44ee8e95ce2220:tools/doom-native-scanf/doom_scanf.c > target/doom-runtime-17-scanf/staged/scanf.c
          test -s target/doom-runtime-17-scanf/staged/scanf.c
      - name: Build genuine 79-engine-unit 16-provider combined ET_REL
        run: |
          python3 tools/doom-native-runtime-bundle/compose.py \
            --source /tmp/doomgeneric-pinned/doomgeneric \
            --format-source target/doom-runtime-17-scanf/staged/format.c \
            --output target/doom-runtime-17-scanf/bundle
      - name: Compose seventeenth import and verify exact one-symbol closure
        run: |
          python3 tools/doom-runtime-17-scanf/compose17.py \
            --bundle target/doom-runtime-17-scanf/bundle \
            --scanner-source target/doom-runtime-17-scanf/staged/scanf.c \
            --output target/doom-runtime-17-scanf/combined
      - name: Archive source-linked ET_REL evidence, not Doom boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doom-real-17-import-composition
          path: |
            target/doom-runtime-17-scanf/bundle/report.json
            target/doom-runtime-17-scanf/combined/report.json
          if-no-files-found: ignore
