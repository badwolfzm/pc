name: Doom WAD sequential file adapter
on:
  pull_request:
    paths:
      - 'tools/doom-wad-file-adapter/**'
      - 'tools/doom-wad-stream/**'
      - '.github/workflows/doom-wad-file-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test read-only adapter
        run: make -C tools/doom-wad-file-adapter test
      - name: Freestanding object build
        run: make -C tools/doom-wad-file-adapter freestanding
      - name: Undefined behavior sanitizer
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wpedantic -fsanitize=undefined \
            tools/doom-wad-file-adapter/adapter.c \
            tools/doom-wad-stream/wad_stream.c \
            tools/doom-wad-file-adapter/test.c -o /tmp/doom-wad-file-ubsan
          /tmp/doom-wad-file-ubsan
