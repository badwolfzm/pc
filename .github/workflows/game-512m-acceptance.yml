name: Warden game 512 MiB evidence gate
on:
  pull_request:
    paths:
      - 'tools/game-512m-acceptance/**'
      - '.github/workflows/game-512m-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strict Python unit tests
        run: python3 -m unittest discover -s tools/game-512m-acceptance -p 'test_*.py' -v
      - name: Python syntax validation
        run: python3 -m py_compile tools/game-512m-acceptance/validate.py tools/game-512m-acceptance/test_validate.py
