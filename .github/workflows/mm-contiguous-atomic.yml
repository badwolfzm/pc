name: Warden atomic contiguous frame allocator extracted-source checks
on:
  pull_request:
    paths:
      - 'crates/warden-kernel/src/mm.rs'
      - 'tools/mm-contiguous-atomic-check/**'
      - '.github/workflows/mm-contiguous-atomic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host-execute actual kernel allocator extracted from source
        run: python3 tools/mm-contiguous-atomic-check/check.py
