name: Native allocator extracted-source defect reproduction
on:
  pull_request:
    paths:
      - 'tools/mm-contiguous-source-repro/**'
      - 'crates/warden-kernel/src/mm.rs'
      - '.github/workflows/mm-contiguous-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python extraction contract
        run: python3 -m unittest discover -s tools/mm-contiguous-source-repro -p 'test_*.py' -v
      - name: Compile real Rust allocator and report defect conditions
        run: python3 tools/mm-contiguous-source-repro/run.py
