name: Actual Warden Pong guest 512 MiB single-vCPU QEMU baseline
on:
  pull_request:
    paths:
      - 'tools/ordinary512-native-qemu/**'
      - '.github/workflows/ordinary512-native-qemu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-512m-pong:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, NASM, binutils and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 nasm binutils build-essential
      - name: Install Warden kernel Rust target
        run: rustup target add x86_64-unknown-none
      - name: Test strict profile conversion
        run: python3 -m unittest discover -s tools/ordinary512-native-qemu -p 'test_*.py' -v
      - name: Set 512 MiB RAM and one vCPU for native Warden guest (ephemeral checkout)
        run: |
          python3 tools/ordinary512-native-qemu/prepare.py tests/kernel/pong.sh --manifest target/native512-profile.json
          grep -F -- '-m 512M -smp 1' tests/kernel/pong.sh
      - name: Boot native Warden Pong and verify kernel evidence
        env:
          LOG: target/native512-pong-serial.log
          SCREENSHOT: target/native512-pong-screen.ppm
        run: |
          timeout 240 bash tests/kernel/pong.sh
          python3 tests/game/check_pong_guest.py target/native512-pong-serial.log
      - name: Preserve configuration and native guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-warden-pong-512m-one-vcpu
          path: |
            target/native512-profile.json
            target/native512-pong-serial.log
            target/native512-pong-screen.ppm
          if-no-files-found: ignore
