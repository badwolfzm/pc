name: Warden console capability identity regression
on:
  pull_request:
    paths:
      - 'crates/warden-kernel/src/thread.rs'
      - 'tools/warden-console-identity/**'
      - '.github/workflows/warden-console-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check privilege regression source contract
        run: python3 -m unittest discover -s tools/warden-console-identity -p 'test_*.py' -v
      - name: Install bare-metal build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          rustup target add x86_64-unknown-none
      - name: Compile genuine freestanding kernel
        run: cargo build -p warden-kernel --target x86_64-unknown-none --release
