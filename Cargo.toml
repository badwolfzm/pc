[workspace]
resolver = "2"
members = ["crates/warden-caps", "crates/warden-abi", "crates/warden-libgrant", "crates/warden-sentry", "crates/warden-kernel"]
# The kernel is bare metal; build it with `cargo build -p warden-kernel --target x86_64-unknown-none`.
default-members = ["crates/warden-caps", "crates/warden-abi", "crates/warden-libgrant", "crates/warden-sentry"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.0.1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
