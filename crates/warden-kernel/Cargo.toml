[package]
name = "warden-kernel"
description = "Warden microkernel: boots on x86-64 under QEMU, runs ring-3 threads in private address spaces under the warden-caps capability model, loads static ELF applications and serves them through a user-space Linux personality server."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
warden-caps = { path = "../warden-caps" }
warden-elf = { path = "../warden-elf" }


[features]
# Pong inside Warden: display + keyboard syscalls, the C guest app and three hostile threads (src/pong.rs).
pong = []
